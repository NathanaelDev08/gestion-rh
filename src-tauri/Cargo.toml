[package]
name = "gestion-rh"
version = "1.0.0"
description = "Logiciel complet de gestion des ressources humaines"
authors = ["Gestion RH"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "gestion_rh_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
chrono = { version = "0.4", features = ["clock"] }
rfd = "0.17"
sha2 = "0.10"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
